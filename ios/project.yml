# Xcode-Projekt für die iPhone/iPad-App (wird auf GitHub mit XcodeGen erzeugt – ein Mac ist nicht nötig).
name: Studienportal
options:
  bundleIdPrefix: de.finnarnold
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.0.0"        # wird beim Bau aus portal/config.py gesetzt
    CURRENT_PROJECT_VERSION: "1"      # wird beim Bau hochgezählt
    CODE_SIGN_STYLE: Automatic
targets:
  Studienportal:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - target: Widgets
        embed: true
      - target: ShareExtension
        embed: true
    entitlements:
      path: App/Studienportal.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)de.finnarnold.studienportal.shared]
        com.apple.security.application-groups: [group.icloud.finnarnold.studienportal]
        com.apple.developer.icloud-container-identifiers: [iCloud.de.finnarnold.gedankenpalast]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.de.finnarnold.gedankenpalast]
        com.apple.developer.icloud-services: [CloudDocuments]
        aps-environment: production
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.finnarnold.studienportal
        PRODUCT_NAME: Studienportal
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Gedankenpalast
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: Damit nur du den Gedankenpalast öffnen kannst.
        NSCameraUsageDescription: Um Fotos (z. B. Tafelbilder) direkt in Notizen und die Ablage aufzunehmen.
        NSMicrophoneUsageDescription: Für Videoaufnahmen, die du in die Ablage lädst.
        NSPhotoLibraryUsageDescription: Um ausgewählte Fotos in Notizen und die Ablage einzufügen.
        NSPhotoLibraryAddUsageDescription: Um Bilder aus dem Portal in Fotos zu sichern.
        NSSupportsLiveActivities: true
        NSAppleMusicUsageDescription: Damit deine Apple-Music-Mediathek, Playlists und Suche im Musik-Player des Gedankenpalasts erscheinen.
        NSRemindersFullAccessUsageDescription: Damit Fristen und Lernaufgaben in deiner Liste „Gedankenpalast“ in Erinnerungen erscheinen.
        NSRemindersUsageDescription: Damit Fristen und Lernaufgaben in deiner Liste „Gedankenpalast“ in Erinnerungen erscheinen.
        # Links aus Widgets und Kurzbefehlen: gedankenpalast://kalender
        CFBundleURLTypes:
          - CFBundleURLName: de.finnarnold.studienportal
            CFBundleURLSchemes: [gedankenpalast]
        # Langes Drücken auf das App-Symbol
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: de.finnarnold.studienportal.kalender
            UIApplicationShortcutItemTitle: Kalender
            UIApplicationShortcutItemIconSymbolName: calendar
          - UIApplicationShortcutItemType: de.finnarnold.studienportal.notizen
            UIApplicationShortcutItemTitle: Notizen
            UIApplicationShortcutItemIconSymbolName: note.text
          - UIApplicationShortcutItemType: de.finnarnold.studienportal.ablage
            UIApplicationShortcutItemTitle: Ablage
            UIApplicationShortcutItemIconSymbolName: folder
          - UIApplicationShortcutItemType: de.finnarnold.studienportal.unimail
            UIApplicationShortcutItemTitle: Uni-Mail
            UIApplicationShortcutItemIconSymbolName: envelope
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true        # Ordner „Gedankenpalast“ unter „Auf meinem iPhone/iPad“ in der Dateien-App
        # Ordner „Gedankenpalast“ in iCloud Drive / Dateien-App
        NSUbiquitousContainers:
          iCloud.de.finnarnold.gedankenpalast:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Gedankenpalast
            NSUbiquitousContainerSupportedFolderLevels: Any
        # „Öffnen in …“ / Teilen: Das Portal erscheint als Ziel für Dokumente, Bilder, Musik und Videos
        CFBundleDocumentTypes:
          - CFBundleTypeName: Dokumente, Bilder und Medien
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.image
              - com.adobe.pdf
              - public.audio
              - public.movie
              - public.text
              - public.presentation
              - public.spreadsheet
              - org.openxmlformats.wordprocessingml.document
              - org.openxmlformats.presentationml.presentation
              - org.openxmlformats.spreadsheetml.sheet
              - com.microsoft.word.doc
              - com.microsoft.powerpoint.ppt
              - com.microsoft.excel.xls
              - com.apple.keynote.key
              - com.apple.iwork.pages.pages
              - com.apple.iwork.numbers.numbers
              - public.zip-archive
    scheme: {}
  Widgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    entitlements:
      path: Widgets/Widgets.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)de.finnarnold.studienportal.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.finnarnold.studienportal.widgets
        PRODUCT_NAME: Widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        ENABLE_PREVIEWS: NO
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Gedankenpalast
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Shared
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)de.finnarnold.studienportal.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.finnarnold.studienportal.share
        PRODUCT_NAME: ShareExtension
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        ENABLE_PREVIEWS: NO
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Gedankenpalast
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 20
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsMovieWithMaxCount: 5
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true

# Baut die Windows-App (Studienportal-App.exe) im öffentlichen App-Repository (kostenlose Windows-Rechner)
# und veröffentlicht sie als Release v<VERSION>. Der Server bietet das neueste Release zum Herunterladen und
# Selbst-Aktualisieren an (portal/server.py → APP_REPO).
name: Windows-App bauen

on:
  push:
    branches: [main]
    paths: ['portal/**', 'app_start.py', 'studienportal-app.spec', 'VERSION', 'web/icons/**', '.github/workflows/windows-app.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'finnnarnold-dot/gedankenpalast-app'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Werkzeuge
        run: python -m pip install pyinstaller==6.11.1 pywebview==5.3.2 pystray==0.19.5 pillow==11.0.0
      - name: Windows-App bauen
        run: pyinstaller --noconfirm studienportal-app.spec
      - name: Selbsttest (Zwischenablage, Verschlüsselung, Fenster)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Studienportal-App.exe -ArgumentList '--selftest' -PassThru -Wait
          Get-Content "$env:TEMP\sp-selftest.txt" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Write-Output "Selbsttest Exit-Code $($p.ExitCode)"; exit 1 }
      - name: Version
        id: ver
        shell: pwsh
        run: '"version=$((Get-Content VERSION).Trim())" >> $env:GITHUB_OUTPUT'
      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Gedankenpalast für Windows ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/Studienportal-App.exe
          body: |
            **Studienportal-App.exe** herunterladen und doppelklicken – sie richtet sich selbst ein (Startmenü, Desktop, Infobereich, „Senden an“) und aktualisiert sich später von allein.
            Windows warnt beim ersten Start, weil die Datei nicht signiert ist: **Weitere Informationen → Trotzdem ausführen**.
